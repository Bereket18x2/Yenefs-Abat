name: yenefs_abat
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^17.2.4
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/sounds/church_bell.mp3
    - assets/images/logo.png

  fonts:
    - family: NotoSansEthiopic
      fonts:
        - asset: fonts/NotoSansEthiopic-VariableFont_wdth,wght.ttf